<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wanda Felsenhardt | Visual Designer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Roboto+Mono:wght@400;500&family=IBM+Plex+Serif:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
    <style>
      html, body {
        margin: 0;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: #000000;
        color: #1a1a1a;
        overflow-x: hidden;
      }
      h1, h2, h3, h4, h5, h6, .font-serif-heading {
        font-family: 'Inter', sans-serif;
        font-weight: 600;
      }
      .font-mono-tag {
        font-family: 'Roboto Mono', monospace;
      }
      .minimal-scroll::-webkit-scrollbar {
        width: 4px;
      }
      .minimal-scroll::-webkit-scrollbar-track {
        background: transparent;
      }
      .minimal-scroll::-webkit-scrollbar-thumb {
        background: #e5e5e5;
        border-radius: 10px;
      }

      .fade-up-element {
        opacity: 0;
        transform: translateY(30px);
        transition: opacity 1s ease-out, transform 1s ease-out;
      }

      .fade-up-element.is-visible {
        opacity: 1;
        transform: translateY(0);
      }

      /* Work grid featured hover glow — class toggled only while hovered (no idle animation). */
      @keyframes work-glow-pulse {
        0%, 100% { opacity: 0.7; transform: scale(1); }
        50% { opacity: 0.9; transform: scale(1.05); }
      }
      .animate-work-glow-pulse {
        animation: work-glow-pulse 4s ease-in-out infinite;
      }

      @keyframes playground-scroll-hint {
        0%, 100% {
          opacity: 0.35;
          transform: translateY(0);
        }
        50% {
          opacity: 0.8;
          transform: translateY(5px);
        }
      }

      .playground-scroll-hint {
        animation: playground-scroll-hint 2.5s ease-in-out infinite;
      }

      @keyframes holo-shine {
        0%, 4% {
          transform: translateX(-85%) rotate(18deg);
          opacity: 0;
        }
        8% {
          transform: translateX(-55%) rotate(18deg);
          opacity: 0.55;
        }
        72% {
          transform: translateX(55%) rotate(18deg);
          opacity: 0.85;
        }
        82%, 100% {
          transform: translateX(85%) rotate(18deg);
          opacity: 0;
        }
      }

      .holo-sticker {
        position: relative;
        display: block;
        flex-shrink: 0;
        width: 9rem;
        height: 9rem;
        transform: rotate(12.5deg);
        transform-origin: center center;
        transition: transform 0.4s cubic-bezier(0.34, 1.2, 0.64, 1);
      }

      @media (min-width: 768px) {
        .holo-sticker {
          width: 12.1rem;
          height: 12.1rem;
        }
      }

      @media (max-width: 767px) {
        .holo-sticker {
          width: 10rem;
          height: 10rem;
        }

        .holo-sticker__inner {
          width: 84%;
          height: 84%;
          padding: 0.45rem;
        }

        .holo-sticker__text {
          font-size: 8.5pt;
          line-height: 1.12;
          letter-spacing: 0;
        }
      }

      .holo-sticker:hover {
        transform: rotate(8deg) scale(1.04) translateY(-2px);
      }

      .holo-sticker__svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
      }

      .holo-sticker__inner {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        justify-content: center;
        width: 76%;
        height: 76%;
        overflow: hidden;
        border-radius: 50%;
        background: transparent;
        padding: 0.75rem;
        text-align: center;
        z-index: 3;
      }

      .holo-sticker__texture {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        opacity: 0.2;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
        background-size: 120px 120px;
        mix-blend-mode: soft-light;
        pointer-events: none;
        z-index: 1;
      }

      .holo-sticker__gloss {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.12) 0%,
          rgba(255, 255, 255, 0.04) 18%,
          transparent 42%
        );
        pointer-events: none;
        z-index: 2;
      }

      .holo-sticker__text {
        position: relative;
        z-index: 5;
        font-family: 'Roboto Mono', monospace;
        font-size: 12pt;
        line-height: 1.15;
        letter-spacing: 0.01em;
        text-transform: uppercase;
        color: rgba(0, 0, 0, 0.88);
      }
    </style>
<script type="importmap">

  "imports": {

}
</script>
</head>

    <div id="root"></div>

  </body>
</html>
